spring.application.name=backend

# -----------------------------------------------------------------------------
# Local secrets (optional): if backend/.env exists it is loaded as a properties
# file. Real OS environment variables always take precedence over it.
# .env is git-ignored - never commit it. See .env.example.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# -----------------------------------------------------------------------------
# Neon PostgreSQL (cloud) - all values come from environment variables.
#   DATABASE_URL  jdbc:postgresql://<host>/<database>?sslmode=require
#   DB_USERNAME   database user
#   DB_PASSWORD   database password
# -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's free tier has a small connection limit; keep the pool modest.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=${PORT:8080}
# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.learningplatform.backend=DEBUG

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

